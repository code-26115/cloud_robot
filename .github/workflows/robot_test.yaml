name: Run Robot Framework Tests

on:
#  push:
 #   branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
   # - cron: '30 5,17 * * *' 
     - cron: '1 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝專案相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 Robot Framework 測試
        run: |
          robot robot_test.robot

      - name: 備份測試結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: output/
